<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر خدمات التواصل الاجتماعي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>اختر الخدمة التي تريدها</h1>
  </header>
  <main>
    <div id="services-container">
      <!-- سيتم إضافة الخدمات هنا باستخدام JavaScript -->
    </div>

    <div id="order-form-container" class="hidden">
      <h2 id="form-title">تفاصيل الطلب</h2>
      <form id="order-form">
        <div class="form-group">
          <label for="service-select">اختر الخدمة:</label>
          <select id="service-select" required></select>
        </div>
        <div class="form-group">
          <label for="link-input">أدخل الرابط:</label>
          <input type="url" id="link-input" placeholder="https://www.instagram.com/..." required>
          <small id="link-warning">الرجاء التأكد من أن الحساب عام وليس خاصاً.</small>
          <p id="link-error" class="error-message"></p>
        </div>
        <div class="form-group">
          <label for="quantity-input">الكمية:</label>
          <input type="number" id="quantity-input" min="100" step="100" value="1000" required>
        </div>
        <div class="form-group">
          <p>السعر: <span id="price-display">0.00</span> $</p>
        </div>
        <button type="submit">تأكيد الطلب</button>
      </form>
      <p id="form-response"></p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
