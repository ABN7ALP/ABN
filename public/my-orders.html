<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلباتي - متجر الخدمات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="my-orders-body">
    <div class="background-gradient"></div>

    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <a href="/" class="logo">متجر الخدمات</a>
            <!-- سيتم ملء القائمة هنا بواسطة JavaScript -->
            <nav id="main-nav" class="main-nav"></nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <section class="hero">
            <h1>سجلاتي</h1>
            <p>هنا يمكنك متابعة حالة جميع معاملاتك وطلباتك السابقة والحالية.</p>
        </section>

        <!-- ======================================= -->
        <!--  القسم الجديد: سجل معاملات الشحن  -->
        <!-- ======================================= -->
        <div class="section-header">
            <h2><i class="ph-bold ph-money"></i> سجل معاملات الشحن</h2>
        </div>
        <div class="table-container">
            <table id="deposits-table" class="responsive-table">
                <thead>
                    <tr>
                        <th>المبلغ</th>
                        <th>الطريقة</th>
                        <th>تاريخ الطلب</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="deposits-tbody">
                    <!-- سيتم ملء البيانات هنا عبر JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="divider"></div> <!-- فاصل بين الجدولين -->

        <!-- ======================================= -->
        <!--      القسم القديم: سجل الطلبات      -->
        <!-- ======================================= -->
        <div class="section-header">
            <h2><i class="ph-bold ph-list-checks"></i> سجل طلبات الخدمات</h2>
        </div>
        <div class="table-container">
            <table id="my-orders-table" class="responsive-table">
                <thead>
                    <tr>
                        <th>المنصة</th>
                        <th>الخدمة</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>تاريخ الطلب</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="my-orders-tbody">
                    <!-- سيتم ملء البيانات هنا عبر JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Popups for Login/Register/Deposit will be handled by the main app.js logic if needed -->
    <!-- We can add them here if direct access is required, but for now, we rely on navigation from the header -->

    <!-- السكربت الجديد الخاص بهذه الصفحة -->
    <script src="my-orders.js"></script>
</body>
</html>
