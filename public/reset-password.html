<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إعادة تعيين كلمة المرور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="background-gradient"></div>

    <header class="main-header">
        <div class="container">
            <a href="/" class="logo">متجر الخدمات</a>
        </div>
    </header>

    <main class="container">
        <div class="popup-content" style="margin: 4rem auto; max-width: 400px;">
            <div class="popup-header">
                <i class="ph-bold ph-key"></i>
                <h2>إعادة تعيين كلمة المرور</h2>
            </div>
            
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">كلمة المرور الجديدة</label>
                    <input type="password" id="new-password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm-password">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password" required minlength="6">
                </div>
                <button type="submit" class="pill-button primary-button">تعيين كلمة المرور</button>
            </form>
            
            <p id="reset-message" style="text-align: center; margin-top: 1rem;"></p>
        </div>
    </main>

    <script>
        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const messageElement = document.getElementById('reset-message');
            
            if (newPassword !== confirmPassword) {
                messageElement.textContent = 'كلمتا المرور غير متطابقتين';
                messageElement.style.color = 'red';
                return;
            }
            
            if (newPassword.length < 6) {
                messageElement.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                messageElement.style.color = 'red';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    messageElement.textContent = data.message + ' يمكنك الآن تسجيل الدخول.';
                    messageElement.style.color = 'green';
                    document.getElementById('reset-password-form').reset();
                    
                    setTimeout(() => {
                        window.location.href = '/index.html#login';
                    }, 3000);
                } else {
                    messageElement.textContent = data.message;
                    messageElement.style.color = 'red';
                }
            } catch (error) {
                messageElement.textContent = 'حدث خطأ في الاتصال بالخادم';
                messageElement.style.color = 'red';
            }
        });
    </script>
</body>
</html>
