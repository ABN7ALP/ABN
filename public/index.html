<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الخدمات الرقمية</title>
    
    <!-- Google Fonts: Cairo (400, 600, 700 weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-gradient"></div>

    <div class="container">
        <header>
            <h1>خدماتنا المميزة</h1>
            <p>اختر المنصة التي تريد دعمها وابدأ فوراً</p>
        </header>

        <main>
            <!-- Service cards will be injected here by JavaScript -->
            <div id="services-container" class="services-grid"></div>
        </main>
    </div>

    <!-- Order Form Popup (Initially Hidden) -->
    <div id="order-popup-overlay" class="popup-overlay hidden">
        <div class="popup-content">
            <button id="close-popup-btn" class="close-btn"><i class="ph-bold ph-x"></i></button>
            <div id="order-form-container">
                <div class="popup-header">
                    <i id="popup-icon" class="ph-bold ph-question"></i>
                    <h2 id="form-title">تفاصيل الطلب</h2>
                </div>
                <form id="order-form">
                    <div class="form-group">
                        <label for="service-select">نوع الخدمة</label>
                        <div class="select-wrapper">
                            <select id="service-select" required></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="link-input">رابط الحساب أو المنشور</label>
                        <input type="url" id="link-input" placeholder="https://www.instagram.com/..." required>
                        <small id="link-warning">تأكد أن الحساب عام وليس خاصاً.</small>
                        <p id="link-error" class="error-message"></p>
                    </div>
                    <div class="form-group">
                        <label for="quantity-input">الكمية المطلوبة</label>
                        <input type="number" id="quantity-input" min="100" step="100" value="1000" required>
                    </div>
                    <div class="price-section">
                        <p>السعر الإجمالي</p>
                        <span id="price-display">0.00 $</span>
                    </div>
                    <button type="submit" class="pill-button primary-button">
                        <i class="ph-bold ph-shopping-cart-simple"></i>
                        <span>تأكيد الطلب</span>
                    </button>
                </form>
            </div>
            
            <!-- Success Message (Initially Hidden) -->
            <div id="success-message-container" class="hidden">
                 <div class="popup-header">
                    <i class="ph-bold ph-check-circle success-icon"></i>
                    <h2>تم بنجاح!</h2>
                </div>
                <p id="form-response" class="success-text">تم استلام طلبك بنجاح وسيتم البدء في تنفيذه قريباً.</p>
                <button id="success-ok-btn" class="pill-button secondary-button">
                    <span>حسناً</span>
                </button>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
